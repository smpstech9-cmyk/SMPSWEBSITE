version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smps_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smps_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: smps_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smps_db}
      JWT_SECRET: ${JWT_SECRET:-smps_super_secret_jwt_key_2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_sample}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-sample_secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: smps_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://smps.in}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
