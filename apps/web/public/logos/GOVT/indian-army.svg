<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none">
  <!-- Crest Background Shield -->
  <g id="IndianArmyEmblem">
    <!-- Crossed Swords & Ashoka Lions Symbolism -->
    <circle cx="45" cy="45" r="38" fill="#B91C1C" stroke="#D97706" stroke-width="2.5"/>
    <circle cx="45" cy="45" r="33" fill="#991B1B" />
    
    <!-- Crossed Scimitars / Swords -->
    <path d="M22 68 L68 22 M20 64 L26 70 L23 73 L17 67 Z" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="#FDE047"/>
    <path d="M68 68 L22 22 M64 70 L70 64 L73 67 L67 73 Z" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="#FDE047"/>
    
    <!-- Central Ashoka Lion Pillar Emblem -->
    <path d="M45 18 L48 24 L52 24 L48 28 L50 34 L45 30 L40 34 L42 28 L38 24 L42 24 Z" fill="#FDE047" />
    <rect x="42" y="32" width="6" height="18" rx="1.5" fill="#FEF08A" />
    <rect x="36" y="50" width="18" height="5" rx="1" fill="#D97706" />
    <circle cx="45" cy="41" r="3" fill="#B91C1C" />
  </g>
  
  <!-- Typography -->
  <text x="96" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#1E293B" letter-spacing="0.5">
    INDIAN ARMY
  </text>
  <text x="96" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#B91C1C" letter-spacing="1.2">
    SERVICE BEFORE SELF • सेना
  </text>
  <text x="96" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.8">
    Defence Technology Partner
  </text>
</svg>

