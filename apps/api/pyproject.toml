[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smps-api"
version = "1.0.0"
description = "SMPS Tech Lab Authoritative Business API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py314']

[tool.flake8]
max-line-length = 100
extend-ignore = "E203, W503"
